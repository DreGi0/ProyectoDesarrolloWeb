<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Evento</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="bg-light">
    <!-- Contenedor principal -->
    <div class="container-fluid">
        <div class="row">
            
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar">
                <div class="position-sticky pt-3">
                    <h4 class="text-white text-center mb-4">Panel Administrador</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../dashboard.html">
                                <i class="bi bi-house-door"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../integrantes/indexIntegrantes.html">
                                <i class="bi bi-people"></i> Integrantes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active bg-primary" href="indexEventos.html">
                                <i class="bi bi-calendar-event"></i> Calendario
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../discografia/indexDiscografia.html">
                                <i class="bi bi-disc"></i> Discografía
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../usuarios/indexUsuarios.html">
                                <i class="bi bi-person-circle"></i> Usuarios
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../usuarios/contraseñaNueva.html">
                                <i class="bi bi-lock-fill"></i> Actualizar contraseña
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Contenido principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                
                <!-- Encabezado -->
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        <i class="bi bi-pencil-square"></i> Editar Evento
                    </h1>
                    <a href="indexEventos.html" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver a la lista
                    </a>
                </div>

                <!-- Mensaje de carga -->
                <div id="mensajeCarga" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p class="mt-3">Cargando datos del evento...</p>
                </div>

                <!-- Formulario (inicialmente oculto) -->
                <div class="card shadow-sm mb-4" id="contenedorFormulario" style="display: none;">
                    <div class="card-body">
                        <form id="formEditarEvento">
                            
                            <!-- Campo oculto con el ID -->
                            <input type="hidden" id="eventoId">
                            
                            <!-- Información del evento -->
                            <div class="mb-4">
                                <h5 class="border-bottom pb-2 mb-3">
                                    <i class="bi bi-info-circle"></i> Información del evento
                                </h5>
                                
                                <div class="row">
                                    <div class="col-md-12 mb-3">
                                        <label for="titulo" class="form-label">Título del evento *</label>
                                        <input type="text" class="form-control" id="titulo" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label for="fecha" class="form-label">Fecha *</label>
                                        <input type="date" class="form-control" id="fecha" required>
                                    </div>

                                    <div class="col-md-4 mb-3">
                                        <label for="hora" class="form-label">Hora *</label>
                                        <input type="time" class="form-control" id="hora" required>
                                    </div>

                                    <div class="col-md-4 mb-3">
                                        <label for="tipo" class="form-label">Tipo de evento *</label>
                                        <select class="form-select" id="tipo" required>
                                            <option value="">Selecciona un tipo</option>
                                            <option value="concierto">Concierto</option>
                                            <option value="entrevista">Entrevista</option>
                                            <option value="lanzamiento">Lanzamiento</option>
                                            <option value="meet-and-greet">Meet & Greet</option>
                                            <option value="otro">Otro</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="lugar" class="form-label">Lugar *</label>
                                    <input type="text" class="form-control" id="lugar" required>
                                </div>

                                <div class="mb-3">
                                    <label for="descripcion" class="form-label">Descripción *</label>
                                    <textarea class="form-control" id="descripcion" rows="4" required></textarea>
                                </div>
                            </div>

                            <!-- Botones de acción -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="button" class="btn btn-secondary" id="btnCancelar">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Actualizar evento
                                </button>
                            </div>

                            <!-- Mensaje de estado -->
                            <div id="mensajeEstado" class="alert mt-3" style="display: none;"></div>
                            
                        </form>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Archivo de JavaScript como módulo -->
    <script type="module">
        import { cargarDatosEvento, actualizarEvento } from '../js/eventos.js';
        
        // Obtener el ID del evento de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const eventoId = urlParams.get('id');

        if (!eventoId) {
            alert('Error: No se proporcionó ID del evento.');
            window.location.href = 'indexEventos.html';
        } else {
            // Cargar datos del evento
            cargarDatosEvento(eventoId);
        }

        // Manejar el envío del formulario
        document.getElementById('formEditarEvento').addEventListener('submit', function(e) {
            e.preventDefault();
            actualizarEvento();
        });

        // Botón "cancelar"
        document.getElementById('btnCancelar').addEventListener('click', function() {
            if(confirm('¿Deseas cancelar? Los cambios no guardados se perderán')) {
                window.location.href = 'indexEventos.html';
            }
        });
    </script>
</body>
</html>
