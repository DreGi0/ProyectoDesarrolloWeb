<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/login.css" />
</head>
  <body class="bg-light">

      <div class="container d-flex justify-content-center align-items-center min-vh-100">
          <div class="login-card w-100 rounded-4 p-5 " style="max-width: 500px;">
              <section class="text-center mb-4" style="color: #1f2937;">
                  <h1 class="mb-2" style="font-family: 'Bebas Neue', sans-serif; font-size: 3rem;">Inicio de Sesión</h1>
                  <p  style="color: #1f2937; font-family: 'Work Sans', sans-serif; font-size: small;">Acceso exclusivo para administradores y empleados autorizados</p>
              </section>

              <section>
                  <form  id="loginForm" action=" " method="post">

                      <div class=" mb-3 position-relative">
                          <i class="bi bi-person-fill position-absolute top-50 translate-middle-y ms-3 icon-color"></i>
                          <input type="email" id="usuario" name="usuario" class="form-control ps-5" placeholder="Correo electrónico" required>
                      </div>

                      <div class="mb-4 position-relative">
                          <i class="bi bi-lock-fill position-absolute top-50 translate-middle-y ms-3 icon-color"></i>
                          <input type="password" id="password" name="password" class="form-control ps-5" placeholder="Contraseña" required>
                      </div>

                      <button id="btnIngresar" type="submit" class="btn-login btn btn-primary w-50 d-block mx-auto" style="font-family: 'Work Sans', sans-serif;">Ingresar</button>

                  </form>
              </section> 
          </div>

      </div>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      <script type="module" src="../js/login.js"></script>

  </body>
</html>
