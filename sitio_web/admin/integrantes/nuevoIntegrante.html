<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo integrante</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="bg-light">
    <!-- Contenedor principal -->
    <div class="container-fluid">
        <div class="row">
            
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar">
                <div class="position-sticky pt-3">
                    <h4 class="text-white text-center mb-4">Panel Administrador</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../dashboard.html">
                                <i class="bi bi-house-door"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active bg-primary" href="indexIntegrantes.html">
                                <i class="bi bi-people"></i> Integrantes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../calendario/indexCalendario.html">
                                <i class="bi bi-calendar-event"></i> Calendario
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../discografia/indexDiscografia.html">
                                <i class="bi bi-disc"></i> Discografía
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Contenido principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                
                <!-- Encabezado -->
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        <i class="bi bi-plus-circle"></i> Agregar Nuevo Integrante
                    </h1>
                    <a href="indexIntegrantes.html" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver a la lista
                    </a>
                </div>

                <!-- Formulario -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <form id="formNuevoIntegrante">
                            
                            <!-- Información Básica -->
                            <div class="mb-4">
                                <h5 class="border-bottom pb-2 mb-3">
                                    <i class="bi bi-person-badge"></i> Información básica
                                </h5>
                                
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="nombre" class="form-label">Nombre del integrante *</label>
                                        <input type="text" class="form-control" id="nombre" placeholder="Ej: Alleh" required>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label for="rol" class="form-label">Rol *</label>
                                        <input type="text" class="form-control" id="rol" placeholder="Ej: Vocalista Principal y Compositor" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="fotoUrl" class="form-label">URL de la foto *</label>
                                    <input type="url" class="form-control" id="fotoUrl" placeholder="https://ejemplo.com/foto.jpg" required>
                                    <div class="form-text">Ingresa la URL completa de la foto</div>
                                </div>
                            </div>

                            <!-- Biografía -->
                            <div class="mb-4">
                                <h5 class="border-bottom pb-2 mb-3">
                                    <i class="bi bi-file-text"></i> Biografía
                                </h5>
                                <div class="alert alert-info">
                                    <i class="bi bi-info-circle"></i> Divide la biografía en cuatro párrafos
                                </div>
                                
                                <div class="mb-3">
                                    <label for="biografiaParrafo1" class="form-label">Párrafo 1 *</label>
                                    <textarea class="form-control" id="biografiaParrafo1" rows="4" placeholder="Primer párrafo de la biografía..." required></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="biografiaParrafo2" class="form-label">Párrafo 2 *</label>
                                    <textarea class="form-control" id="biografiaParrafo2" rows="4" placeholder="Segundo párrafo de la biografía..." required></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="biografiaParrafo3" class="form-label">Párrafo 3 *</label>
                                    <textarea class="form-control" id="biografiaParrafo3" rows="4" placeholder="Tercer párrafo de la biografía..." required></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="biografiaParrafo4" class="form-label">Párrafo 4 *</label>
                                    <textarea class="form-control" id="biografiaParrafo4" rows="4" placeholder="Cuarto párrafo de la biografía..." required></textarea>
                                </div>
                            </div>

                            <!-- Logros -->
                            <div class="mb-4">
                                <h5 class="border-bottom pb-2 mb-3">
                                    <i class="bi bi-trophy"></i> Logros
                                </h5>
                                
                                <div class="mb-3">
                                    <label class="form-label">Lista de logros *</label>
                                    <div class="alert alert-info">
                                        <i class="bi bi-info-circle"></i> Agrega cuatro logros principales del integrante
                                    </div>
                                    
                                    <input type="text" class="form-control mb-2" id="logro1" placeholder="Logro 1" required>
                                    <input type="text" class="form-control mb-2" id="logro2" placeholder="Logro 2" required>
                                    <input type="text" class="form-control mb-2" id="logro3" placeholder="Logro 3" required>
                                    <input type="text" class="form-control" id="logro4" placeholder="Logro 4" required>
                                </div>
                            </div>

                            <!-- Estilo Musical -->
                            <div class="mb-4">
                                <h5 class="border-bottom pb-2 mb-3">
                                    <i class="bi bi-music-note-beamed"></i> Estilo Musical
                                </h5>
                                
                                <div class="mb-3">
                                    <label for="estiloMusical" class="form-label">Descripción del estilo musical *</label>
                                    <textarea class="form-control" id="estiloMusical" rows="6" placeholder="Describe el estilo musical del integrante..." required></textarea>
                                </div>
                            </div>

                            <!-- Botones de acción -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="button" class="btn btn-secondary" id="btnCancelar">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Guardar integrante
                                </button>
                            </div>

                            <!-- Mensaje de estado -->
                            <div id="mensajeEstado" class="alert mt-3" style="display: none;"></div>
                            
                        </form>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Archivo de JavaScript como módulo -->
    <script type="module">
        import { crearIntegrante } from '../js/integrantes.js';
        
        // Manejar el envío del formulario
        document.getElementById('formNuevoIntegrante').addEventListener('submit', function(e) {
            e.preventDefault();
            crearIntegrante();
        });

        // Botón "cancelar"
        document.getElementById('btnCancelar').addEventListener('click', function() {
            if(confirm('¿Deseas cancelar? Los cambios no guardados se perderán')) {
                window.location.href = 'indexIntegrantes.html';
            }
        });
    </script>
</body>
</html>
