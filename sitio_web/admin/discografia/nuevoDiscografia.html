<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo album</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body class="bg-light">
    <!-- Contenedor principal -->
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar">
          <div class="position-sticky pt-3">
            <h4 class="text-white text-center mb-4">Panel Administrador</h4>
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link text-white" href="../dashboard.html">
                  <i class="bi bi-house-door"></i> Dashboard
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="indexIntegrantes.html">
                  <i class="bi bi-people"></i> Integrantes
                </a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link text-white"
                  href="../calendario/indexCalendario.html"
                >
                  <i class="bi bi-calendar-event"></i> Calendario
                </a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link active bg-primary"
                  href="../discografia/indexDiscografia.html"
                >
                  <i class="bi bi-disc"></i> Discografía
                </a>
              </li>
            </ul>
          </div>
        </nav>

        <!-- Contenido principal -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
          <!-- Encabezado -->
          <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom"
          >
            <h1 class="h2">
              <i class="bi bi-plus-circle"></i> Agregar Nuevo Album
            </h1>
            <a href="indexDiscografia.html" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left"></i> Volver a la lista
            </a>
          </div>

          <!-- Formulario -->
          <div class="card shadow-sm mb-4">
            <div class="card-body">
              <form id="formNuevoAlbum">
                <!-- Información Básica -->
                <div class="mb-4">
                  <h5 class="border-bottom pb-2 mb-3">
                    <i class="bi bi-vinyl"></i> Información básica
                  </h5>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label for="titulo" class="form-label"
                        >Titulo del album *</label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="titulo"
                        placeholder="Ej: La Ciudad"
                        required
                      />
                    </div>

                    <div class="col-md-6 mb-3">
                      <label for="numCanciones" class="form-label"
                        >Número de canciones *</label
                      >
                      <input
                        type="number"
                        class="form-control"
                        id="numCanciones"
                        placeholder="1"
                        required
                      />
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="portada" class="form-label"
                      >URL de la foto *</label
                    >
                    <input
                      type="url"
                      class="form-control"
                      id="portada"
                      placeholder="https://ejemplo.com/foto.jpg"
                      required
                    />
                    <div class="form-text">
                      Ingresa la URL completa de la foto
                    </div>
                  </div>
                </div>

                <!-- Tracklists -->
                <div class="mb-4">
                  <h5 class="border-bottom pb-2 mb-3">
                    <i class="bi bi-music-note-beamed"></i> Tracklist
                  </h5>
                  <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i> Ingresa las canciones del
                    album
                  </div>
                  <div id="contenedorTracklist">
                    <div class="mb-3">
                      <label for="numeroTracklist" class="form-label"
                        >Número en tracklist *</label
                      >
                      <input
                        type="number"
                        class="form-control"
                        id="numeroTracklist"
                        placeholder="1"
                        required
                      />
                    </div>

                    <div class="mb-3">
                      <label for="nombreCancion" class="form-label"
                        >Nombre de la canción *</label
                      >
                      <input
                        class="form-control"
                        id="nombreCancion"
                        placeholder="Ej: La ciudad"
                        required
                      />
                    </div>

                    <div class="mb-3">
                      <label for="duracion" class="form-label"
                        >Duración *</label
                      >
                      <input
                        class="form-control"
                        id="duracion"
                        placeholder="Ej: 2:24"
                        required
                      />
                    </div>

                    <div class="mb-3">
                      <label for="audioLink" class="form-label"
                        >URL del audio *</label
                      >
                      <input
                        class="form-control"
                        id="audioLink"
                        placeholder="https://ejemplo.com/audio.mp3"
                        required
                      />
                    </div>
                  </div>
                </div>

                <!-- Créditos -->
                <div class="mb-4">
                  <h5 class="border-bottom pb-2 mb-3">
                    <i class="bi bi-r-circle"></i> Créditos
                  </h5>

                  <div class="mb-3">
                    <label for="fecha" class="form-label"
                      >Fecha de lanzamiento *</label
                    >
                    <input
                      type="date"
                      class="form-control"
                      id="fecha"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label for="productora" class="form-label"
                      >Productora *</label
                    >
                    <input
                      class="form-control"
                      id="productora"
                      placeholder="2025 CONMUER LLC"
                      required
                    />
                  </div>
                </div>

                <!-- Botones de acción -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    id="btnCancelar"
                  >
                    <i class="bi bi-x-circle"></i> Cancelar
                  </button>
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Guardar album
                  </button>
                </div>

                <!-- Mensaje de estado -->
                <div
                  id="mensajeEstado"
                  class="alert mt-3"
                  style="display: none"
                ></div>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Archivo de JavaScript como módulo -->
    <script type="module">
      import { crearAlbum, generarInputsCanciones } from "../js/discografia.js";

      // Generar los inputs paara las canciones
      document
        .getElementById("numCanciones")
        .addEventListener("input", function () {
          const cantidad = parseInt(this.value);

          if (cantidad > 0) {
            generarInputsCanciones(cantidad, "contenedorTracklist");
          }
        });
      // Manejar el envío del formulario
      document
        .getElementById("formNuevoAlbum")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          crearAlbum();
        });

      // Botón "cancelar"
      document
        .getElementById("btnCancelar")
        .addEventListener("click", function () {
          if (
            confirm("¿Deseas cancelar? Los cambios no guardados se perderán")
          ) {
            window.location.href = "indexDiscografia.html";
          }
        });
    </script>
  </body>
</html>
