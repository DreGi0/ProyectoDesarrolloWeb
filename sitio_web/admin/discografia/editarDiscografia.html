<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar discografia</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body class="bg-light">
    <!-- Contenedor principal -->
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar">
          <div class="position-sticky pt-3">
            <h4 class="text-white text-center mb-4">Panel Administrador</h4>
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link text-white" href="../dashboard.html">
                  <i class="bi bi-house-door"></i> Dashboard
                </a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link text-white"
                  href="../integrantes/indexIntegrantes.html"
                >
                  <i class="bi bi-people"></i> Integrantes
                </a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link text-white"
                  href="../calendario/indexCalendario.html"
                >
                  <i class="bi bi-calendar-event"></i> Calendario
                </a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link active bg-primary"
                  href="indexDiscografia.html"
                >
                  <i class="bi bi-disc"></i> Discografía
                </a>
              </li>
            </ul>
          </div>
        </nav>

        <!-- Contenido principal -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
          <!-- Encabezado -->
          <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom"
          >
            <h1 class="h2"><i class="bi bi-pencil-square"></i> Editar album</h1>
            <a href="indexDiscografia.html" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left"></i> Volver a la lista
            </a>
          </div>

          <!-- Mensaje de carga -->
          <div id="mensajeCarga" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-3">Cargando datos del album...</p>
          </div>

          <!-- Formulario (inicialmente oculto) -->
          <div
            class="card shadow-sm mb-4"
            id="contenedorFormulario"
            style="display: none"
          >
            <div class="card-body">
              <form id="formEditarAlbum">
                <!-- Campo oculto con el ID -->
                <input type="hidden" id="albumId" />

                <!-- Información Básica -->
                <div class="mb-4">
                  <h5 class="border-bottom pb-2 mb-3">
                    <i class="bi bi-vinyl"></i> Información básica
                  </h5>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label for="titulo" class="form-label">Título *</label>
                      <input
                        type="text"
                        class="form-control"
                        id="titulo"
                        required
                      />
                    </div>

                    <div class="col-md-6 mb-3">
                      <label for="numCanciones" class="form-label"
                        >Número de canciones *</label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="numCanciones"
                        required
                      />
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="portada" class="form-label"
                      >URL de la portada *</label
                    >
                    <input
                      type="url"
                      class="form-control"
                      id="portada"
                      required
                    />
                    <div class="form-text">
                      Ingresa la URL completa de la portada
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Vista previa:</label>
                    <div>
                      <img
                        id="vistaPrevia"
                        src=""
                        alt="Vista previa"
                        class="img-thumbnail"
                        style="max-width: 200px"
                      />
                    </div>
                  </div>
                </div>

                <!-- tracklist -->
                <div class="mb-4">
                  <h5 class="border-bottom pb-2 mb-3">
                    <i class="bi bi-music-note-beamed"></i> Tracklist
                  </h5>
                  <div id="contenedorTracklist"></div>
                </div>

                <!-- Créditos-->
                <div class="mb-4">
                  <h5 class="border-bottom pb-2 mb-3">
                    <i class="bi bi-r-circle"></i> Créditos
                  </h5>

                  <div class="mb-3">
                    <label for="fecha" class="form-label"
                      >Fecha de lanzamiento *</label
                    >
                    <input
                      type="date"
                      class="form-control"
                      id="fecha"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label for="productora" class="form-label"
                      >Productora *</label
                    >
                    <input class="form-control" id="productora" required />
                  </div>
                </div>

                <!-- Botones de acción -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    id="btnCancelar"
                  >
                    <i class="bi bi-x-circle"></i> Cancelar
                  </button>
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Actualizar album
                  </button>
                </div>

                <!-- Mensaje de estado -->
                <div
                  id="mensajeEstado"
                  class="alert mt-3"
                  style="display: none"
                ></div>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Archivo de JavaScript como módulo -->
    <script type="module">
      import {
        cargarDatosAlbum,
        actualizarAlbum,
        generarInputsCanciones,
      } from "../js/discografia.js";

      // Obtener el ID del album de la URL
      const urlParams = new URLSearchParams(window.location.search);
      const albumId = urlParams.get("id");

      if (!albumId) {
        alert("Error: No se proporcionó ID del album");
        window.location.href = "indexDiscografia.html";
      } else {
        // Cargar datos del integrante
        cargarDatosAlbum(albumId);
      }

      // manejar el numero de canciones
      document
        .getElementById("numCanciones")
        .addEventListener("change", function () {
          const cantidad = parseInt(this.value);
          if (cantidad > 0) {
            if (
              confirm(
                "Si cambia el número se borarrán los datos de las canciones actuales. ¿Desea continuar?"
              )
            ) {
              generarInputsCanciones(cantidad, "contenedorTracklist");
            }
          }
        });

      // Manejar el envío del formulario
      document
        .getElementById("formEditarAlbum")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          actualizarAlbum();
        });

      // Botón "cancelar"
      document
        .getElementById("btnCancelar")
        .addEventListener("click", function () {
          if (
            confirm("¿Deseas cancelar? Los cambios no guardados se perderán")
          ) {
            window.location.href = "indexDiscografia.html";
          }
        });

      // Actualizar la vista previa cuando cambie la URL de la foto
      document.getElementById("portada").addEventListener("input", function () {
        document.getElementById("vistaPrevia").src = this.value;
      });
    </script>
  </body>
</html>
