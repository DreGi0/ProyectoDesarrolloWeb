<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="bg-light">
    <!-- Contenedor principal -->
    <div class="container-fluid">
        <div class="row">
            
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar">
                <div class="position-sticky pt-3">
                    <h4 class="text-white text-center mb-4">Panel Administrador</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../dashboard.html">
                                <i class="bi bi-house-door"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../integrantes/indexIntegrantes.html">
                                <i class="bi bi-people"></i> Integrantes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../calendario/indexCalendario.html">
                                <i class="bi bi-calendar-event"></i> Calendario
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../discografia/indexDiscografia.html">
                                <i class="bi bi-disc"></i> Discografía
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../usuarios/indexUsuarios.html">
                                <i class="bi bi-person-circle"></i> Usuarios
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active bg-primary" href="../usuarios/contraseñaNueva.html">
                                <i class="bi bi-lock-fill"></i> Actualizar contraseña
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Contenido principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                
                <!-- Encabezado -->
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        <i class="bi bi-lock"></i> Contraseña Nueva
                    </h1>
                </div>

                <!-- Formulario de contraseña nueva -->
                <div class="card shadow-sm mb-4" id="contenedorFormulario">
                    <div class="card-body">

                        <form id="formCambiarContrasena">

                            <div class="mb-3">
                                <label for="passwordActual" class="form-label fw-bold">
                                    Contraseña actual
                                </label>
                                <input type="password" class="form-control" id="passwordActual"required>
                            </div>

                            <div class="mb-3">
                                <label for="passwordNueva" class="form-label fw-bold">
                                    Nueva contraseña
                                </label>
                                <input type="password" class="form-control" id="passwordNueva" required placeholder="mínimo 6 caracteres">
                            </div>

                            <div class="mb-3">
                                <label for="passwordConfirmar" class="form-label fw-bold">
                                    Confirmar nueva contraseña
                                </label>
                                <input type="password" class="form-control" id="passwordConfirmar" required>
                            </div>

                            <div id="mensajeCambiarPass" class="alert d-none"></div>

                            <button type="submit" class="btn btn-primary w-100 mt-2">
                                <i class="bi bi-check-circle"></i> Guardar cambios
                            </button>

                        </form>

                    </div>
                </div>

                
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/contraseñaNueva.js" type="module"></script>

    <script type="module">
    import { requireAuth } from "../js/auth.js";
    requireAuth();
    </script>

</body>
</html>
