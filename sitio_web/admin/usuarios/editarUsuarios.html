<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="bg-light">
    <!-- Contenedor principal -->
    <div class="container-fluid">
        <div class="row">
            
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar">
                <div class="position-sticky pt-3">
                    <h4 class="text-white text-center mb-4">Panel Administrador</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../dashboard.html">
                                <i class="bi bi-house-door"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="indexIntegrantes.html">
                                <i class="bi bi-people"></i> Integrantes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../calendario/indexCalendario.html">
                                <i class="bi bi-calendar-event"></i> Calendario
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../discografia/indexDiscografia.html">
                                <i class="bi bi-disc"></i> Discografía
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active bg-primary" href="../usuarios/indexUsuarios.html">
                                <i class="bi bi-person-circle"></i> Usuarios
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Contenido principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                
                <!-- Encabezado -->
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        <i class="bi bi-pencil-square"></i> Editar Usuario
                    </h1>
                    <a href="indexUsuarios.html" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver a la lista
                    </a>
                </div>

                <!-- Mensaje de carga -->
                <div id="mensajeCarga" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p class="mt-3">Cargando datos del usuario...</p>
                </div>

                <!-- Formulario (inicialmente oculto) -->
                <div class="card shadow-sm mb-4" id="contenedorFormulario" style="display: none;">
                    <div class="card-body">
                        <form id="formEditarUsuario">
                            
                            <!-- Campo oculto con el ID -->
                            <input type="hidden" id="usuarioId">
                            
                            <!-- Información Básica -->
                            <div class="mb-4">
                                <h5 class="border-bottom pb-2 mb-3">
                                    <i class="bi bi-person-badge"></i> Información básica
                                </h5>
                                
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="nombre" class="form-label">Nombre*</label>
                                        <input type="text" class="form-control" id="nombre" required>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label for="apellido" class="form-label">Apellido *</label>
                                        <input type="text" class="form-control" id="apellido" required>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label for="email" class="form-label">Correo *</label>
                                        <input type="email" class="form-control" id="email" required>
                                    </div>

                                </div>

                            </div>

                            <!-- Botones de acción -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="button" class="btn btn-secondary" id="btnCancelar">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Actualizar usuario
                                </button>
                            </div>

                            <!-- Mensaje de estado -->
                            <div id="mensajeEstado" class="alert mt-3" style="display: none;"></div>
                            
                        </form>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Archivo de JavaScript como módulo -->
    <script type="module">
        import { cargarDatosUsuario, actualizarUsuario } from '../js/usuarios.js';
        
        // Obtener el ID del usuario de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const usuarioId = urlParams.get('id');

        if (!usuarioId) {
            alert('Error: No se proporcionó ID del usuario.');
            window.location.href = 'indexUsuarios.html';
        } else {
            // Cargar datos del usuario
            cargarDatosUsuario(usuarioId);
        }

        // Manejar el envío del formulario
        document.getElementById('formEditarUsuario').addEventListener('submit', function(e) {
            e.preventDefault();
            actualizarUsuario();
        });

        // Botón "cancelar"
        document.getElementById('btnCancelar').addEventListener('click', function() {
            if(confirm('¿Deseas cancelar? Los cambios no guardados se perderán')) {
                window.location.href = 'indexUsuarios.html';
            }
        });

    </script>
</body>
</html>
