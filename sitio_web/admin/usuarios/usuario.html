<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de usuario</title>

    <!-- Bootstrap Icons y Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

    <!-- Estilos del panel admin -->
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="bg-light">
    
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-12 col-md-3 col-lg-2 d-md-block bg-dark sidebar">
                <div class="position-sticky pt-3">
                    <h4 class="text-white text-center mb-4">Panel Administrador</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../dashboard.html">
                                <i class="bi bi-house-door"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../integrantes/indexIntegrantes.html">
                                <i class="bi bi-people"></i> Integrantes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../calendario/indexEventos.html">
                                <i class="bi bi-calendar-event"></i> Calendario
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../discografia/indexDiscografia.html">
                                <i class="bi bi-disc"></i> Discografía
                            </a>
                        </li>
                        <li class="nav-item">
                            <!-- Usuarios activo -->
                            <a class="nav-link active bg-primary text-white" aria-current="page" href="indexUsuarios.html">
                                <i class="bi bi-person-circle"></i> Usuarios
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="./contraseñaNueva.html">
                                <i class="bi bi-lock-fill"></i> Actualizar contraseña
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Contenido principal -->
            <main class="col-12 col-md-9 ms-sm-auto col-lg-10 px-md-4">
                
                <!-- Encabezado -->
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2 mb-0">
                        <i class="bi bi-person-plus"></i> Registro de usuario
                    </h1>
                    <a href="indexUsuarios.html" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver a la lista
                    </a>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="border-bottom pb-2 mb-3">
                            <i class="bi bi-person-vcard"></i> Datos del usuario
                        </h5>
                        <p class="text-muted mb-4">
                            Por favor regístrese y complete la siguiente información.
                        </p>

                        <!-- Formulario para registrar usuario -->
                        <form id="registerForm" method="post">

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="idFirstName" class="form-label">Nombre *</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-person-fill"></i>
                                    </span>
                                    <input type="text" class="form-control" id="idFirstName"name="firstName"placeholder="Nombre" required>
                                </div>
                            </div>

                            <!-- Apellido -->
                            <div class="mb-3">
                                <label for="idLastName" class="form-label">Apellido *</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-person-fill"></i>
                                    </span>
                                    <input type="text" class="form-control" id="idLastName" name="lastName" placeholder="Apellido" required>
                                </div>
                            </div>

                            <!-- Correo electrónico -->
                            <div class="mb-3">
                                <label for="usuario" class="form-label">Correo electrónico *</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-envelope-fill"></i>
                                    </span>
                                    <input type="email" class="form-control" id="usuario" name="email" placeholder="Correo electrónico" required>
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-4">
                                <label for="password" class="form-label">Contraseña *</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                                </div>
                            </div>

                            <!-- Botón -->
                            <div class="d-grid d-sm-flex justify-content-sm-end">
                                <button type="submit" class="btn btn-primary px-4" >
                                    <i class="bi bi-check2-circle"></i> Crear cuenta
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!--Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/nuevoUsuario.js"></script>
</body>
</html>
