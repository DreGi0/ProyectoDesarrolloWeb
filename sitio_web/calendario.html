<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alleh y Yorghaki</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/calendario.css">
</head>
<body>
    <header>
        <h1>Alleh y Yorghaki</h1>
        <input type="checkbox" id="checkMenu">
        <label for="checkMenu" class="labelBotonMenu" aria-label="Abrir menú" role="button">
            <i class="fa-solid fa-bars" id="btnMostrar" aria-hidden="true"></i>
            <i class="fa-solid fa-xmark" id="btnOcultar" aria-hidden="true"></i>
        </label>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="noticias.html">Noticias</a></li>
                <li><a href="integrantes.html">Integrantes</a></li>
                <li><a href="galeria.html">Galeria</a></li>
                <li><a href="calendario.html" class="pag-selecion">Calendario</a></li>
                <li><a href="merch.html">Merch</a></li>
                <li><a href="discografia.html">Discografía</a></li>
                <li><a href="historia.html">Historia</a></li>
                <li><a href="acerca.html">Acerca de</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main class="container calendario-page">
        <section class="cal-header">
            <button id="prevMonth" aria-label="Mes anterior">&lsaquo;</button>
            <div class="cal-title" aria-live="polite">
                <h2 id="monthYear">Mes Año</h2>
            </div>
            <button id="nextMonth" aria-label="Mes siguiente">&rsaquo;</button>
        </section>

        <section class="calendar" aria-label="Calendario de eventos">
            <div class="weekdays">
                <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
            </div>
            <div id="calendarGrid" class="grid" role="grid"></div>
        </section>
    
        <!-- Modal para eventos y asi -->
        <div id="eventModal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
            <div class="modal-content">
                <button id="closeModal" class="modal-close" aria-label="Cerrar">&times;</button>
                <h3 id="modalTitle">Título evento</h3>
                <p id="modalWhen">Fecha / hora</p>
                <p id="modalPlace"></p>
                <p id="modalDesc"></p>
            </div>
        </div>
    </main>

    <footer>
      <section class="redes-sociales">
        <a href="https://www.instagram.com/laciudadtour/" target="_blank"
          ><i class="fa-brands fa-instagram"></i
        ></a>
        <a href="https://open.spotify.com/artist/4eq1q0o9XPyNq9RG3fNDD1"
          ><i class="fa-brands fa-spotify"></i
        ></a>
        <a href="https://www.youtube.com/@Yorghaki"
          ><i class="fa-brands fa-youtube"></i
        ></a>
        <a href="https://www.tiktok.com/@allehyorghaki"
          ><i class="fa-brands fa-tiktok"></i
        ></a>
      </section>
    </footer>

    <script src="js/calendario.js" defer></script>
</body>
</html>
